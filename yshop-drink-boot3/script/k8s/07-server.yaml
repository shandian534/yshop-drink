apiVersion: apps/v1
kind: Deployment
metadata:
  name: yshop-server
  namespace: yshop
  labels:
    app: yshop-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yshop-server
  template:
    metadata:
      labels:
        app: yshop-server
    spec:
      containers:
      - name: yshop-server
        # 镜像需要根据实际情况替换，或使用构建脚本推送
        image: yshop-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 48080
          name: http
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: server-config
              key: SPRING_PROFILES_ACTIVE
        - name: JAVA_OPTS
          valueFrom:
            configMapKeyRef:
              name: server-config
              key: JAVA_OPTS
        - name: MASTER_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: server-config
              key: MASTER_DATASOURCE_URL
        - name: MASTER_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: server-config
              key: MASTER_DATASOURCE_USERNAME
        - name: MASTER_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password
        - name: SLAVE_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: server-config
              key: SLAVE_DATASOURCE_URL
        - name: SLAVE_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: server-config
              key: SLAVE_DATASOURCE_USERNAME
        - name: SLAVE_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: server-config
              key: REDIS_HOST
        - name: ARGS
          value: |
            --spring.datasource.dynamic.datasource.master.url=$(MASTER_DATASOURCE_URL)
            --spring.datasource.dynamic.datasource.master.username=$(MASTER_DATASOURCE_USERNAME)
            --spring.datasource.dynamic.datasource.master.password=$(MASTER_DATASOURCE_PASSWORD)
            --spring.datasource.dynamic.datasource.slave.url=$(SLAVE_DATASOURCE_URL)
            --spring.datasource.dynamic.datasource.slave.username=$(SLAVE_DATASOURCE_USERNAME)
            --spring.datasource.dynamic.datasource.slave.password=$(SLAVE_DATASOURCE_PASSWORD)
            --spring.data.redis.host=$(REDIS_HOST)
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 48080
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 48080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: yshop-server
  namespace: yshop
  labels:
    app: yshop-server
spec:
  ports:
  - port: 48080
    targetPort: 48080
    name: http
    protocol: TCP
  selector:
    app: yshop-server
  type: ClusterIP
