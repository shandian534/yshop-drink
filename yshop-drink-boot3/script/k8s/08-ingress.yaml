apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yshop-ingress
  namespace: yshop
  annotations:
    # 根据集群的Ingress Controller调整以下注解
    # nginx.ingress.kubernetes.io/rewrite-target: /
    # nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
  # API服务
  - host: api.yshop.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: yshop-server
            port:
              number: 48081
  # 管理界面
  - host: admin.yshop.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: yshop-admin
            port:
              number: 80
