# yshop-drink H5 Kubernetes 部署配置

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yshop-drink-h5
  labels:
    app: yshop-drink-h5
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yshop-drink-h5
  template:
    metadata:
      labels:
        app: yshop-drink-h5
    spec:
      containers:
      - name: yshop-drink-h5
        image: ${IMAGE_NAME}
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /h5/
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /h5/
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: yshop-drink-h5
  labels:
    app: yshop-drink-h5
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: yshop-drink-h5
