apiVersion: v1
kind: ConfigMap
metadata:
  name: server-config
  namespace: yshop
data:
  # Spring配置
  SPRING_PROFILES_ACTIVE: "local"
  # Java启动参数
  JAVA_OPTS: "-Xms512m -Xmx512m -Djava.security.egd=file:/dev/./urandom"
  # 应用参数
  MASTER_DATASOURCE_URL: "jdbc:mysql://mysql:3306/yixiang-drink?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true"
  MASTER_DATASOURCE_USERNAME: "root"
  SLAVE_DATASOURCE_URL: "jdbc:mysql://mysql:3306/yixiang-drink?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true"
  SLAVE_DATASOURCE_USERNAME: "root"
  REDIS_HOST: "redis"
